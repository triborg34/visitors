# پیکربندی Nginx برای زیر‌دامنه visitors.amnafarinan.ir
# نصب:
#   sudo cp deploy/nginx/visitors.amnafarinan.ir.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/visitors.amnafarinan.ir.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name visitors.amnafarinan.ir;

    # مسیر پایگاه داده و فایل‌های حساس از روت وب سرو نشوند
    location ~* ^/(server|prisma|\.git|node_modules) {
        return 404;
    }

    location / {
        root /var/www/amnafarinan/app/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 5m;
    }

    location ~* \.(woff2|woff|ttf|css|js|png|jpg|jpeg|svg|ico)$ {
        root /var/www/amnafarinan/app/client/dist;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 5m;
}
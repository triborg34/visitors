# پیکربندی Nginx برای استقرار روی مسیر زیرمجموعه /visitors
# هشدار: این فایل نمونه است و باید داخل بلوک server موجود در سایت اصلی ادغام شود.
# پیشنهاد: به‌جای این روش، از زیر‌دامنه visitors.amnafarinan.ir استفاده کنید.

server {
    listen 80;
    listen [::]:80;
    server_name amnafarinan.ir;

    # بدون تغییر در محل نصب فعلی PrestaShop
    location / {
        # ... پیکربندی فعلی PrestaShop ...
    }

    location /visitors/assets/ {
        alias /var/www/amnafarinan/app/client/dist/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /visitors/ {
        alias /var/www/amnafarinan/app/client/dist/;
        try_files $uri $uri/ /visitors/index.html;
        index index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}